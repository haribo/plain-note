[package]
name = "plain-note-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "plain-note-gui"
path = "src/main.rs"

[dependencies]
note-core.workspace = true
plain-note-client.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-channel = "2"
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }

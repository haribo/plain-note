[workspace]
resolver = "3"
members = ["protocol", "core", "client", "cli", "relay", "gui", "mobile"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/haribo/plain-note"
authors = []

[workspace.dependencies]
# Internal
note-core = { path = "core" }
note-protocol = { path = "protocol" }
note-relay = { path = "relay" }
plain-note-client = { path = "client" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime / networking
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"

# Encoding
base64 = "0.23"
hex = "0.4"

# HTTP client (CLI enrollment)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CRDT
automerge = "0.5"

# Mobile bindings (Android via UniFFI)
uniffi = "0.28"

# Crypto (AEAD + KDF + signatures)
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = "0.5"
ed25519-dalek = "3"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
